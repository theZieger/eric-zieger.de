<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>eric-zieger.de has moved</title>
    <meta
      name="description"
      content="eric-zieger.de has been shut down. Eric Höppner now lives at hoeppner.fyi."
    />
    <link rel="canonical" href="https://hoeppner.fyi/" />
    <link rel="icon" href="/favicon.png" />
    <meta name="theme-color" content="#121217" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&display=swap"
    />
    <style>
      :root {
        --color-brand-bg: #121217;
        --color-brand-green: #0fd974;
        --color-text-primary: #f5f5f5;
        --color-text-secondary: #a3a3a3;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
      }

      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        min-height: 100dvh;
        padding: 1.5rem;
        background: var(--color-brand-bg);
        color: var(--color-text-primary);
        font-family: "Geist", ui-sans-serif, system-ui, sans-serif;
        text-align: center;
        -webkit-font-smoothing: antialiased;
      }

      main {
        max-width: 36rem;
      }

      h1 {
        margin: 0 0 1rem;
        font-size: 1.875rem;
        font-weight: 600;
        line-height: 1.25;
      }

      p {
        margin: 0 0 2rem;
        font-size: 1.125rem;
        line-height: 1.625;
        color: var(--color-text-secondary);
      }

      a {
        font-size: 1.25rem;
        font-weight: 600;
        color: var(--color-brand-green);
        text-decoration: none;
        outline: 2px solid transparent;
        outline-offset: 4px;
        transition: color 150ms;
      }

      a:hover {
        color: var(--color-text-primary);
      }

      a:focus-visible {
        outline-color: var(--color-brand-green);
      }

      @media (min-width: 48rem) {
        h1 {
          font-size: 2.25rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>This page has been shut down.</h1>
      <p>
        After getting married and taking my wife's name, Eric Zieger became
        Eric Höppner &mdash; and this website retired along with the old name.
      </p>
      <a href="https://hoeppner.fyi/">Find me at hoeppner.fyi &rarr;</a>
    </main>
  </body>
</html>
